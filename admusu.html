<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGRSI - Administrar Usuarios</title>
    <script src="assets/js/verificarinicio.js"></script>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/admusu.css">
    <link rel="stylesheet" href="assets/css/iniciodoc.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body id="admusu">
    <header class="top-bar">
        <h2>Administrar Usuarios</h2>
        <nav>
            <a href="inicioadm.html">Volver a la página principal</a>
            <a href="#" id="btn-cerrar-sesion" class="logout-link">Cerrar Sesion</a>
        </nav>
    </header>
    <main>
        <section class="seleccionar-accion-AEM">
            <label for="adminsusu">Seleccione una accion</label>
            <select name="adminsusu" id="adminsusu" required>
                <option value="Agregar">Agregar Usuario</option>
                <option value="Eliminar">Eliminar Usuario</option>
                <option value="Modificar">Modificar Usuario</option>
            </select>
        </section>

        <form id="form-agregar-usu" action="" class="reporte-docente">
            <h2>Agregar Usuario</h2>
            <label for="cedula">Cedula</label>
            <input type="text" id="cedula" name="cedula" autocomplete="name" title="Ingrese los 8 numeros de la cedula sin puntos ni guiones" pattern="[1-9][0-9]{7}" inputmode="numeric" maxlength="8" required>
            
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 12 caracteres" minlength="12" required>
            
            <label for="rol">Seleccione un rol</label>
            <select name="rol" id="rol" required>
                <option value="admin">Administrador</option>
                <option value="docente">Docente</option>
                <option value="soporte">Soporte Técnico</option>
            </select>
            <section class="botones-container">
                <button type="submit" class="btn-enviar">Agregar Usuario</button>
            </section>
        </form>

        <form id="form-eliminar-usu" action="" class="reporte-docente" style="display: none;">
            <h2>Eliminar Usuario</h2>
            <label for="cedula-eliminar">Cedula del usuario a eliminar</label>
            <input type="text" id="cedula-eliminar" name="cedula-eliminar" autocomplete="name" title="Ingrese los 8 numeros de la cedula sin puntos ni guiones" pattern="[1-9][0-9]{7}" inputmode="numeric" maxlength="8" required>
            <section class="botones-container">
                <button type="submit" class="btn-enviar">Eliminar Usuario</button>
            </section>
        </form>

        <form id="form-modificar-usu" action="" class="reporte-docente" style="display: none;">
            <h2>Modificar Usuario</h2>
            <label for="cedula-modificar">Cedula del usuario a modificar</label>
            <input type="text" id="cedula-modificar" name="cedula-modificar" autocomplete="name" title="Ingrese los 8 numeros de la cedula sin puntos ni guiones" pattern="[1-9][0-9]{7}" inputmode="numeric" maxlength="8" required>
            
            <label for="nuevo-password">Nueva Contraseña</label>
            <input type="password" id="nuevo-password" name="nuevo-password" placeholder="Mínimo 12 caracteres (Opcional)" minlength="12">
            
            <label for="nuevo-rol">Seleccione un nuevo rol</label>
            <select name="nuevo-rol" id="nuevo-rol">
                <option value="">Mantener rol actual</option>
                <option value="admin">Administrador</option>
                <option value="docente">Docente</option>
                <option value="soporte">Soporte Técnico</option>
            </select>
            <section class="botones-container">
                <button type="submit" class="btn-enviar">Modificar Usuario</button>
            </section>
        </form>
    </main>
    <script src="assets/js/admusu.js"></script>
    <script src="assets/js/cerrarsesion.js"></script>
</body>
</html>

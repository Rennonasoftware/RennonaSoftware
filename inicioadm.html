<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGRSI - Inicio Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/inicioadm.css">
    <link rel="stylesheet" href="style.css">
    <script src="assets/js/verificarinicio.js"></script>
</head>
<body id="inicioadm">

    <header class="top-bar">
        <h2>Bienvenido, Admin</h2>
        <nav>
            <a href="admusu.html">Administrar Usuarios</a>
            <a href="#" id="btn-cerrar-sesion" class="logout-link">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="login-container">
            <div class="login-header">
                <h2>Gestionar usuarios</h2>
                <p>Sistema de Gestión de Usuarios</p>
            </div>
            
            <form id="formLogin" action="Logincontroller.php" method="POST">
                <div class="input-group">
                    <label for="inputCedula">Cédula de Identidad / Usuario</label>
                    <input type="text" id="inputCedula" name="username" placeholder="Ej: 12345678" required>
                </div>
                
                <div class="input-group">
                    <label for="inputClave">Contraseña</label>
                    <input type="password" id="inputClave" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-login">Ingresar al Sistema</button>
            </form>
        </div>
    </main>

    <script src="assets/js/admin.js"></script>
    <script src="assets/js/cerrarsesion.js"></script>
    <script src="Loging.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística Rivera - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>control de usuarios</h2>
            <p>Sistema de Gestión de Usuarios</p>
        </div>
        
        <form id="formLogin">
            <div class="input-group">
                <label for="inputCedula">Cédula de Identidad</label>
                <input type="text" id="inputCedula" placeholder="Ej: 12345678" required>
            </div>
            
            <div class="input-group">
                <label for="inputClave">Contraseña</label>
                <input type="password" id="inputClave" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
